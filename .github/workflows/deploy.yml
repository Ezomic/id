name: Deploy to production

# DISABLED. This workflow is disabled on GitHub (`gh workflow list` shows
# `disabled_manually`), so dispatching it returns HTTP 422 and nothing runs.
# It is kept only as a record of what an automated deploy would do.
#
# Production is deployed by hand over SSH:
#
#   ssh -i ~/.ssh/id_ed25519_thijssensoftware_deploy root@165.22.203.180 \
#     "sudo -u deploy bash -c 'cd /home/deploy/id && bash scripts/deploy.sh'"
#
# To bring this back, re-enable it with `gh workflow enable deploy.yml` and
# delete this comment.
on:
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/deploy/id && bash scripts/deploy.sh
